name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: actions/checkout@v5
      - name: Build
        run: go build .
      - name: Test
        run: go test -v ./...
